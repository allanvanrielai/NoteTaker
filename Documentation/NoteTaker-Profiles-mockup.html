<title>NoteTaker Profiles Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,700&display=swap" rel="stylesheet">
<style>
/* Layout: heading row (logo right in Mint), backup line below, toolbar, stacked containers beside a sticky header list.
   Two profiles x light/dark = four token sets. Default = Allan's personal brand. Mint = Mint Group FY27. */
:root {
  /* Default profile, light. Palette: Midnight #253D52, Warm gray #525254, Mist bg #EEF2F7, Muted blue #4880AE,
     Soft sky #A0C2DB, Mist gray #9A9AA4, Muted Blue Dark #325A7A */
  --bg: #EEF2F7; --surface: #FFFFFF; --surface-hover: #EEF2F7;
  --field: #FFFFFF; --field-locked: #EEF2F7;
  --text: #253D52; --text-muted: #525254; --heading: #253D52;
  --sub: #525254; --sub-size: 15px; --sub-weight: 400; --sub-style: normal;
  --mark: #325A7A; --highlight: #4880AE; --border: #9A9AA4;
  --btn-bg: #325A7A; --btn-text: #FFFFFF; --btn-border: 1.5px solid transparent;
  --cta-bg: #253D52; --cta-text: #FFFFFF; --cta-size: 15px;
  --focus: #4880AE; --sig: rgba(72,128,174,.14);
  --radius: 14px; --radius-btn: 8px; --head-weight: 700;
  --font: Arial, Helvetica, sans-serif;
  --logo-display: none; --rule-display: none; --logo-plate: transparent; --logo-plate-pad: 0;
  --mono: Consolas, "Cascadia Mono", "Courier New", monospace;
}
:root[data-profile="mint"] {
  --bg: #FFFFFF; --surface: #EDEEF0; --surface-hover: #CFD8DB;
  --field: #FFFFFF; --field-locked: #CFD8DB;
  --text: #475054; --text-muted: #626E73; --heading: #184B9A;
  --sub: #439E46; --sub-size: 19px; --sub-weight: 700; --sub-style: italic;
  --mark: #439E46; --highlight: #F15927; --border: #CFD8DB;
  --btn-bg: #184B9A; --btn-text: #FFFFFF; --btn-border: 1.5px solid transparent;
  --cta-bg: #F48130; --cta-text: #243C7A; --cta-size: 19px;
  --focus: #184B9A; --sig: transparent;
  --radius: 20px; --radius-btn: 999px; --head-weight: 300;
  --font: "Lato", Arial, sans-serif;
  --logo-display: inline-block; --rule-display: block;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #253D52; --surface: #325A7A; --surface-hover: rgba(238,242,247,.14);
    --field: #253D52; --field-locked: #325A7A;
    --text: #FFFFFF; --text-muted: #EEF2F7; --heading: #FFFFFF; --sub: #EEF2F7;
    --mark: #A0C2DB; --highlight: #A0C2DB; --border: rgba(238,242,247,.45);
    --btn-bg: #EEF2F7; --btn-text: #253D52; --btn-border: 1.5px solid transparent;
    --cta-bg: #A0C2DB; --cta-text: #253D52; --focus: #A0C2DB; --sig: rgba(160,194,219,.12);
    color-scheme: dark;
  }
  :root[data-profile="mint"]:not([data-theme="light"]) {
    --bg: #243C7A; --surface: #184B9A; --surface-hover: rgba(255,255,255,.14);
    --field: #243C7A; --field-locked: #184B9A;
    --text: #FFFFFF; --text-muted: #CFD8DB; --heading: #FFFFFF; --sub: #89C146;
    --mark: #89C146; --highlight: #F48130; --border: rgba(255,255,255,.3);
    --btn-bg: #184B9A; --btn-text: #FFFFFF; --btn-border: 1.5px solid #65A1D7;
    --cta-bg: #F48130; --cta-text: #243C7A; --focus: #85C4EB; --sig: transparent;
    --logo-plate: #CFD8DB; --logo-plate-pad: 14px 22px;
  }
}
:root[data-theme="dark"] {
  --bg: #253D52; --surface: #325A7A; --surface-hover: rgba(238,242,247,.14);
  --field: #253D52; --field-locked: #325A7A;
  --text: #FFFFFF; --text-muted: #EEF2F7; --heading: #FFFFFF; --sub: #EEF2F7;
  --mark: #A0C2DB; --highlight: #A0C2DB; --border: rgba(238,242,247,.45);
  --btn-bg: #EEF2F7; --btn-text: #253D52; --btn-border: 1.5px solid transparent;
  --cta-bg: #A0C2DB; --cta-text: #253D52; --focus: #A0C2DB; --sig: rgba(160,194,219,.12);
  color-scheme: dark;
}
:root[data-profile="mint"][data-theme="dark"] {
  --bg: #243C7A; --surface: #184B9A; --surface-hover: rgba(255,255,255,.14);
  --field: #243C7A; --field-locked: #184B9A;
  --text: #FFFFFF; --text-muted: #CFD8DB; --heading: #FFFFFF; --sub: #89C146;
  --mark: #89C146; --highlight: #F48130; --border: rgba(255,255,255,.3);
  --btn-bg: #184B9A; --btn-text: #FFFFFF; --btn-border: 1.5px solid #65A1D7;
  --cta-bg: #F48130; --cta-text: #243C7A; --focus: #85C4EB; --sig: transparent;
  --logo-plate: #CFD8DB; --logo-plate-pad: 14px 22px;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5; margin: 0; }
.page { position: relative; overflow: clip; padding: 28px 16px 56px; }
.sig { position: absolute; right: -110px; top: -150px; width: 440px; height: 440px; border-radius: 50%; background: var(--sig); pointer-events: none; }
.wrap { position: relative; max-width: 1424px; margin-inline: auto; display: grid; gap: 20px; }
button, input { font-family: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Heading row */
.hero { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px 24px; }
h1 { margin: 0; font-weight: var(--head-weight); font-size: clamp(28px, 4vw, 40px); line-height: 1.15; color: var(--heading); }
.sub { margin: 6px 0 0; color: var(--sub); font-size: var(--sub-size); font-weight: var(--sub-weight); font-style: var(--sub-style); }
.rule { display: var(--rule-display); width: 64px; height: 4px; border-radius: 4px; background: var(--mark); margin-top: 14px; }
.logo { display: var(--logo-display); background: var(--logo-plate); padding: var(--logo-plate-pad); border-radius: var(--radius); line-height: 0; }
.logo img { width: 190px; height: auto; display: block; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; color: var(--text-muted); font-size: 14px; }
.backup { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--text); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--mark); }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.cta { background: var(--cta-bg); color: var(--cta-text); border: 0; border-radius: var(--radius-btn); padding: 8px 22px; font-weight: 700; font-size: var(--cta-size); cursor: pointer; }
.btn { background: var(--btn-bg); color: var(--btn-text); border: var(--btn-border); border-radius: var(--radius-btn); padding: 8px 16px; font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn.quiet { background: transparent; color: var(--text); border: 1.5px solid var(--border); }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.search { flex: 1 1 240px; max-width: 420px; display: flex; align-items: center; gap: 10px; background: var(--field); border: 1.5px solid var(--border); border-radius: var(--radius-btn); padding: 8px 16px; color: var(--text-muted); }
.search input { border: 0; background: transparent; color: var(--text); font-size: 15px; width: 100%; min-width: 0; outline: none; }
.search:focus-within { border-color: var(--focus); }
.seg { display: inline-flex; align-items: center; gap: 10px; color: var(--text-muted); font-size: 13px; font-weight: 700; }
.seg .group { display: inline-flex; border: 1.5px solid var(--border); border-radius: var(--radius-btn); overflow: hidden; }
.seg .group > * { padding: 7px 16px; font-size: 14px; font-weight: 700; color: var(--text-muted); background: transparent; border: 0; }
.seg .group > button { cursor: pointer; }
.seg .group > .on { background: var(--btn-bg); color: var(--btn-text); }

/* Main */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; }
.card { background: var(--surface); border-radius: var(--radius); padding: 16px 20px 18px; display: grid; gap: 12px; min-width: 0; }
.card.pinned { box-shadow: inset 0 0 0 2px var(--highlight); }
.head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.grip svg { width: 14px; height: 18px; fill: var(--text-muted); display: block; }
.titlef { position: relative; flex: 1; min-width: 0; }
.titlef input { width: 100%; background: var(--field); color: var(--text); border: 1.5px solid var(--border); border-radius: 10px; padding: 8px 40px 8px 14px; font-size: 16px; font-weight: 700; }
.titlef input::placeholder { color: var(--text-muted); font-weight: 700; }
.titlef input[readonly] { background: var(--field-locked); }
.titlef svg { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: none; stroke: var(--text-muted); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.arr { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; background: transparent; color: var(--text); border: 1.5px solid var(--border); border-radius: 10px; cursor: pointer; flex: none; padding: 0; }
.arr:disabled { opacity: .4; cursor: default; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.tool { background: transparent; border: 1.5px solid var(--border); color: var(--text); border-radius: var(--radius-btn); padding: 6px 14px; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.tool.primary { background: var(--btn-bg); color: var(--btn-text); border: var(--btn-border); }
.tool[aria-pressed="true"] { border-color: var(--highlight); }
.note { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 13px; }
.ok { width: 18px; height: 18px; border-radius: 50%; background: var(--mark); color: var(--bg); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.ok svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
textarea { width: 100%; height: 400px; resize: vertical; background: var(--field); color: var(--text); border: 1.5px solid var(--border); border-radius: 12px; padding: 14px 16px; font-family: var(--mono); font-size: 14px; line-height: 1.55; }
textarea:focus, .titlef input:focus { border-color: var(--focus); outline: none; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--text-muted); font-size: 13px; }
.meta b { color: var(--text); font-weight: 700; }
.card.collapsed textarea, .card.collapsed .meta, .card.collapsed .note { display: none; }
.card.collapsed { padding-block: 14px; }

/* Header list */
.side { position: sticky; top: 16px; background: var(--surface); border-radius: var(--radius); padding: 18px 16px 12px; display: grid; gap: 8px; }
.side h2 { margin: 0 4px 4px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--heading); }
.entry { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 12px; border-radius: 14px; border: 0; background: transparent; text-align: left; color: var(--text); cursor: pointer; width: 100%; font-size: 14px; }
.entry:hover, .entry.here { background: var(--surface-hover); }
.entry .t { font-weight: 700; color: var(--heading); display: flex; align-items: center; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
.entry .t svg { width: 13px; height: 13px; fill: none; stroke: var(--highlight); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.entry .w { font-size: 13px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.entry .s { grid-column: 1 / -1; font-size: 12.5px; color: var(--text-muted); }
.sdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--mark); }
.sdot.none { background: transparent; border: 1.5px solid var(--text-muted); }

@media (max-width: 900px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; order: -1; }
}
@media (prefers-reduced-motion: no-preference) { .card, .entry, .btn, .tool { transition: background-color .15s, border-color .15s; } }
</style>

<script>
var cards = [
  { id: "c1", title: "Flow review prompt", file: "Flow review prompt.txt", pinned: true, collapsed: false, edited: "10:42",
    text: "You are helping me review a Power Automate flow before it goes to the client.\n\nContext: the flow emails a calendar invitation from the events mailbox when someone registers through a Microsoft Form.\n\nCheck the following and answer as a short numbered list:\n1. Does the error handling cover every action that can fail?\n2. Are any action names still the defaults?\n3. Is anything hard-coded that belongs in an environment variable?\n\nKeep the tone direct, and tell me where you disagree with my approach." },
  { id: "c2", title: "Expression: invite end time", file: "Expression invite end time.txt", pinned: false, collapsed: true, edited: "09:15",
    text: "addMinutes(triggerOutputs()?['body/StartTime'], int(variables('DurationMinutes')))" },
  { id: "c3", title: "Scratch: second look at 15:30", file: null, pinned: false, collapsed: true, edited: "10:05",
    text: "Revisit the wording of the throttling question before sending it to the customer. Shorter. One question, not three." }
];
var seq = 3;
var ic = function (id) { return '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><use href="#' + id + '"/></svg>'; };
var esc = function (s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); };
var words = function (t) { var m = t.trim().match(/\S+/g); return m ? m.length : 0; };
var fmt = function (n) { return n.toLocaleString("en-ZA").replace(/ /g, " "); };
var byId = function (id) { return cards.filter(function (x) { return x.id === id; })[0]; };
var shown = function () { return cards.slice().sort(function (a, b) { return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0); }); };
var query = function () { return (document.getElementById("q").value || "").toLowerCase(); };
var visible = function () { var q = query(); return shown().filter(function (c) { return !q || (c.title + " " + c.text).toLowerCase().indexOf(q) > -1; }); };

function draw() {
  var o = shown(), vis = visible();
  document.getElementById("stack").innerHTML = vis.map(function (c) {
    var i = o.indexOf(c);
    var upOff = i === 0 || o[i - 1].pinned || c.pinned, downOff = i === o.length - 1 || c.pinned;
    return '<section class="card' + (c.collapsed ? " collapsed" : "") + (c.pinned ? " pinned" : "") + '" id="' + c.id + '">' +
      '<div class="head">' +
        '<span class="grip" aria-hidden="true"><svg viewBox="0 0 14 18"><circle cx="4" cy="4" r="1.5"/><circle cx="10" cy="4" r="1.5"/><circle cx="4" cy="9" r="1.5"/><circle cx="10" cy="9" r="1.5"/><circle cx="4" cy="14" r="1.5"/><circle cx="10" cy="14" r="1.5"/></svg></span>' +
        '<div class="titlef"><input type="text" data-title="' + c.id + '" value="' + esc(c.title) + '" placeholder="Untitled" aria-label="Title"' + (c.file ? " readonly" : "") + '>' + (c.file ? '<svg viewBox="0 0 16 16" aria-hidden="true"><use href="#i-lock"/></svg>' : "") + '</div>' +
        '<button class="arr" type="button" data-act="up" data-id="' + c.id + '" aria-label="Move up"' + (upOff ? " disabled" : "") + '>' + ic("i-up") + '</button>' +
        '<button class="arr" type="button" data-act="down" data-id="' + c.id + '" aria-label="Move down"' + (downOff ? " disabled" : "") + '>' + ic("i-down") + '</button>' +
      '</div>' +
      '<div class="tools">' +
        '<button class="tool primary" type="button">' + ic("i-save") + 'Save</button>' +
        '<button class="tool" type="button">' + ic("i-saveas") + 'Save As</button>' +
        '<button class="tool" type="button" data-act="copy" data-id="' + c.id + '">' + ic("i-copy") + '<span>Copy</span></button>' +
        '<button class="tool" type="button" data-act="pin" data-id="' + c.id + '" aria-pressed="' + c.pinned + '">' + ic("i-pin") + '<span>' + (c.pinned ? "Pinned" : "Pin") + '</span></button>' +
        '<button class="tool" type="button" data-act="fold" data-id="' + c.id + '">' + ic(c.collapsed ? "i-expand" : "i-collapse") + '<span>' + (c.collapsed ? "Expand" : "Collapse") + '</span></button>' +
        '<button class="tool" type="button">' + ic("i-trash") + 'Delete</button>' +
      '</div>' +
      '<div class="note">' + (c.file ? '<span class="ok" title="Saved to file"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg></span>Linked to ' + esc(c.file) + '. The title follows the file name.' : 'No file yet. The title locks to the file name on first save.') + '</div>' +
      '<textarea data-id="' + c.id + '" aria-label="Text">' + esc(c.text) + '</textarea>' +
      '<div class="meta"><span><b data-w="' + c.id + '"></b> words</span><span><b data-c="' + c.id + '"></b> characters</span><span>Last edited <b>' + c.edited + '</b></span></div>' +
    '</section>';
  }).join("");
  count(); list();
}
function count() {
  cards.forEach(function (c) {
    var w = document.querySelector('[data-w="' + c.id + '"]'), ch = document.querySelector('[data-c="' + c.id + '"]');
    if (w) w.textContent = fmt(words(c.text));
    if (ch) ch.textContent = fmt(c.text.length);
  });
}
function list() {
  document.getElementById("list").innerHTML = visible().map(function (c) {
    return '<button class="entry' + (c.collapsed ? "" : " here") + '" type="button" data-go="' + c.id + '">' +
      '<span class="t">' + (c.pinned ? ic("i-pin") : "") + esc(c.title || "Untitled") + '</span>' +
      '<span class="w">' + fmt(words(c.text)) + ' w</span>' +
      '<span class="s"><span class="sdot' + (c.file ? "" : " none") + '"></span>' + c.edited + ' &middot; ' + (c.file ? "Saved to file" : "No file, unsaved") + (c.collapsed ? " &middot; collapsed" : "") + '</span></button>';
  }).join("");
}
document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-act]");
  if (b) {
    var c = byId(b.dataset.id), a = b.dataset.act;
    if (a === "fold") { c.collapsed = !c.collapsed; draw(); }
    if (a === "pin") { var was = c.pinned; cards.forEach(function (x) { x.pinned = false; }); c.pinned = !was; draw(); }
    if (a === "up" || a === "down") {
      var o = shown(), i = o.indexOf(c), j = i + (a === "up" ? -1 : 1);
      if (j >= 0 && j < o.length && !o[j].pinned && !c.pinned) {
        var ai = cards.indexOf(o[i]), aj = cards.indexOf(o[j]), tmp = cards[ai]; cards[ai] = cards[aj]; cards[aj] = tmp; draw();
      }
    }
    if (a === "copy") {
      var lab = b.querySelector("span"), done = function () { lab.textContent = "Copied"; setTimeout(function () { lab.textContent = "Copy"; }, 1200); };
      try { navigator.clipboard.writeText(c.text).then(done, function () {}); } catch (err) {}
    }
    return;
  }
  var g = e.target.closest("[data-go]");
  if (g) { var el = document.getElementById(g.dataset.go); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
});
document.addEventListener("input", function (e) {
  var t = e.target;
  if (t.id === "q") { draw(); return; }
  if (t.dataset && t.dataset.title) { byId(t.dataset.title).title = t.value; list(); return; }
  if (t.dataset && t.dataset.id) { byId(t.dataset.id).text = t.value; count(); list(); }
});
document.getElementById("new").addEventListener("click", function () {
  seq += 1; cards.unshift({ id: "n" + seq, title: "", file: null, pinned: false, collapsed: false, edited: "now", text: "" }); draw();
});
function isDark() {
  var r = document.documentElement;
  return r.getAttribute("data-theme") === "dark" ||
    (!r.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
}
function paintTheme() { document.getElementById("themelabel").textContent = isDark() ? "Light mode" : "Dark mode"; }
document.getElementById("theme").addEventListener("click", function () {
  document.documentElement.setAttribute("data-theme", isDark() ? "light" : "dark");
  paintTheme();
});
try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintTheme); } catch (err) {}
paintTheme();
function setProfile(p) {
  var r = document.documentElement;
  if (p === "mint") r.setAttribute("data-profile", "mint"); else r.removeAttribute("data-profile");
  document.getElementById("p-default").className = p === "mint" ? "" : "on";
  document.getElementById("p-mint").className = p === "mint" ? "on" : "";
  document.getElementById("p-default").setAttribute("aria-pressed", p !== "mint");
  document.getElementById("p-mint").setAttribute("aria-pressed", p === "mint");
  try { localStorage.setItem("nt-mock-profile", p); } catch (err) {}
}
document.getElementById("p-default").addEventListener("click", function () { setProfile("default"); });
document.getElementById("p-mint").addEventListener("click", function () { setProfile("mint"); });
try { if (localStorage.getItem("nt-mock-profile") === "mint") setProfile("mint"); } catch (err) {}
draw();
</script>
