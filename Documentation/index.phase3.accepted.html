<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NoteTaker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try { var t = localStorage.getItem("notetaker-theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) { /* storage blocked: follow the system setting */ }</script>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --line: #c9ced6; --text: #1d2129; --muted: #5d6573;
    --accent: #1a5fd0; --warn-bg: #fff4d6; --warn-line: #e0b84a; --err-bg: #fde4e4; --err-line: #d65a5a;
    --ok: #217a3c; --accent-bg: #e6efff; --warn: #9a5b00; --on-accent: #ffffff; --bad: #c62828;
    --cardw: 1060px; --idxw: 528px; --texth: 400px; --fs: 14px; --hdr: 52px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181d; --card: #20242b; --line: #3a404b; --text: #e8eaee; --muted: #9aa3b2;
      --accent: #6aa0ff; --warn-bg: #3b3317; --warn-line: #8a7324; --err-bg: #3d1d1d; --err-line: #9a4343;
      --ok: #6fcf8a; --accent-bg: #26324a; --warn: #ffb84d; --on-accent: #0b1020; --bad: #ff8a80;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181d; --card: #20242b; --line: #3a404b; --text: #e8eaee; --muted: #9aa3b2;
    --accent: #6aa0ff; --warn-bg: #3b3317; --warn-line: #8a7324; --err-bg: #3d1d1d; --err-line: #9a4343;
    --ok: #6fcf8a; --accent-bg: #26324a; --warn: #ffb84d; --on-accent: #0b1020; --bad: #ff8a80;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; height: var(--hdr); background: var(--bg); border-bottom: 1px solid var(--line);
           padding: 0 16px; display: flex; flex-wrap: nowrap; gap: 12px; align-items: center; }
  h1 { font-size: 18px; margin: 0; }
  button { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 4px;
           background: var(--card); color: var(--text); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  #themeBtn { margin-left: auto; white-space: nowrap; }
  #count, #backup { color: var(--muted); font-size: 12px; }
  #backup.ok { color: var(--ok); } #backup.bad { color: var(--bad); font-weight: 600; }
  .banner { margin: 10px 16px 0; padding: 8px 12px; border-radius: 4px; border: 1px solid; }
  .banner.warn { background: var(--warn-bg); border-color: var(--warn-line); }
  .banner.err { background: var(--err-bg); border-color: var(--err-line); }
  #empty { margin: 32px 16px; color: var(--muted); }
  #layout { display: grid; grid-template-columns: minmax(0, var(--cardw)) minmax(240px, var(--idxw)); justify-content: center;
            gap: 16px; padding: 14px 16px 60px; align-items: start; }
  #grid { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  @media (max-width: 900px) { #layout { grid-template-columns: minmax(0, 1fr); } #side { position: static; max-height: none; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 6px;
          scroll-margin-top: calc(var(--hdr) + 12px); }
  .card.flash { animation: flash 1.1s ease-out; }
  @keyframes flash { 0% { background: var(--accent-bg); } 100% { background: var(--card); } }
  .title { width: 100%; font: inherit; font-weight: 600; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px;
           background: transparent; color: var(--text); }
  .btns { display: flex; flex-wrap: wrap; gap: 4px; }
  textarea.body { width: 100%; height: var(--texth); resize: vertical; overflow: auto; padding: 8px; font: var(--fs)/1.45 Consolas, "Courier New", monospace;
                  border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--text); }
  .btnwrap { position: relative; display: inline-block; }
  .toast { position: absolute; left: 0; top: calc(100% + 3px); z-index: 4; white-space: nowrap; pointer-events: none;
           background: var(--text); color: var(--bg); padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
  .badge { color: var(--warn); font-weight: 600; }
  .titlerow { display: flex; gap: 6px; align-items: center; }
  .titlerow .title { flex: 1; min-width: 0; }
  .title[readonly] { background: color-mix(in srgb, var(--line) 25%, transparent); }
  .lock { flex: none; font-size: 15px; }
  .small { font-size: 11px; color: var(--muted); margin-top: -2px; }
  .cardstatus:empty { display: none; }
  .panel { border: 1px solid var(--err-line); background: var(--err-bg); border-radius: 4px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .panel.warn { border-color: var(--warn-line); background: var(--warn-bg); }
  .panel .pmsg { font-size: 13px; }
  .panel .pbtns { display: flex; flex-wrap: wrap; gap: 6px; }
  .card[hidden], #index li[hidden] { display: none !important; }
  .card.pinned { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card.collapsed .small, .card.collapsed textarea.body, .card.collapsed .meta { display: none; }
  .card.dragging { opacity: .45; }
  .reorder { display: inline-flex; gap: 4px; align-items: center; flex: none; }
  .reorder button { padding: 2px 8px; }
  .grip { cursor: grab; user-select: none; touch-action: none; flex: none; padding: 2px 4px; color: var(--muted); font-size: 16px; line-height: 1; }
  .grip:active { cursor: grabbing; }
  .grip.off { opacity: .35; cursor: not-allowed; }
  body[data-sort="edited"] .reorder, body[data-sort="edited"] .grip { display: none; }
  body.is-dragging { user-select: none; cursor: grabbing; }
  #dropline { position: fixed; height: 4px; border-radius: 2px; background: var(--accent); z-index: 20; pointer-events: none; display: none; }
  #q { width: 100%; font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--text); }
  .sortrow { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
  .sortrow label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
  .nomatch { color: var(--muted); font-size: 12px; padding: 6px 8px; }
  #side { position: sticky; top: calc(var(--hdr) + 10px); max-height: calc(100vh - var(--hdr) - 24px); display: flex; flex-direction: column; min-width: 0; }
  #side .box { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  #side h2 { font-size: 13px; margin: 0; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  #index { list-style: none; margin: 0; padding: 0; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
  #index li { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-radius: 4px; cursor: pointer; border: 1px solid transparent; }
  #index li:hover { border-color: var(--line); }
  #index li.active { background: var(--accent-bg); border-color: var(--accent); }
  #index .ic { width: 18px; text-align: center; flex: none; color: var(--accent); font-size: 13px; }
  #index .ib { min-width: 0; flex: 1; }
  #index .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #index .t.untitled { font-weight: 400; font-style: italic; color: var(--muted); }
  #index .s { font-size: 11px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <h1>NoteTaker</h1>
  <button id="newCard" class="primary">New container</button>
  <span id="count"></span>
  <span id="backup" class="ok">Backup: starting…</span>
  <button id="themeBtn" type="button">Dark</button>
</header>
<div id="banners"></div>
<div id="dropline"></div>
<div id="empty" hidden>No containers yet. Click <b>New container</b> to start.</div>
<div id="layout">
  <main id="grid"></main>
  <aside id="side">
    <div class="box">
      <h2>Containers</h2>
      <input id="q" type="search" placeholder="Search titles and text" aria-label="Search containers" autocomplete="off">
      <div class="sortrow" role="radiogroup" aria-label="Order">
        <label><input type="radio" name="sort" value="edited"> Sort by last edited</label>
        <label><input type="radio" name="sort" value="manual"> Manual order</label>
      </div>
      <ul id="index"></ul>
      <div id="nomatchSide" class="nomatch" hidden>No containers match.</div>
    </div>
  </aside>
</div>

<script>
"use strict";

// ===== <pure-logic> (no DOM or storage access; unit-tested by Testing/phase1-unit.mjs) =====
function countWords(text) { const t = text.trim(); return t ? t.split(/\s+/).length : 0; }
function countChars(text) { return Array.from(text).length; }           // includes spaces
function pad2(n) { return String(n).padStart(2, "0"); }
function formatStamp(ms) {
  const d = new Date(ms);
  return d.getFullYear() + "/" + pad2(d.getMonth() + 1) + "/" + pad2(d.getDate()) + " " +
         pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
}
// "" = nothing to flag, "never-saved" = text exists but was never saved to a file, "unsaved" = differs from last saved text
function unsavedState(card) {
  if (card.savedText === null) return card.text === "" ? "" : "never-saved";
  return card.text !== card.savedText ? "unsaved" : "";
}
function newCard(now, id) {
  return { id: id, title: "", text: "", createdAt: now, lastEdited: now,
           savedText: null, pinned: false, collapsed: false };
}
const CARD_DEFAULTS = { title: "", text: "", savedText: null, pinned: false, collapsed: false, locked: false, fileName: null, lastModified: null, savedAt: null, order: null };
function normalizeCard(c) { return Object.assign({}, CARD_DEFAULTS, c); }   // cards stored by an earlier phase gain the new fields
const RESERVED_NAME = /^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])$/i;
// File-name-safe version of a title: removes \ / : * ? " < > | and control characters, trims spaces, removes trailing dots,
// caps at 100 characters, and prefixes "_" to Windows reserved names (CON, PRN, AUX, NUL, COM1-9, LPT1-9). Returns "" if nothing is left.
function sanitizeTitle(title) {
  const trimEnd = (x) => x.replace(/[\s.]+$/, "");
  let s = String(title).replace(/[\\/:*?"<>|\u0000-\u001f\u007f]/g, "").replace(/^\s+/, "");
  s = trimEnd(s);
  s = trimEnd(Array.from(s).slice(0, 100).join(""));
  if (!s) return "";
  if (RESERVED_NAME.test(s.split(".")[0])) s = "_" + s;
  return s;
}
function defaultFileName(title, now) {
  const base = sanitizeTitle(title);
  if (!base) {
    const d = new Date(now);
    return "User_Text_" + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + "_" + pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds()) + ".txt";
  }
  return /\.(txt|md)$/i.test(base) ? base : base + ".txt";
}
function stripExtension(name) { const r = name.replace(/\.[^./\\]+$/, ""); return r || name; }
// Steps 1 and 2 of the save routine. file = { ok: true, lastModified } or { ok: false, errorName }.
function checkBeforeWrite(file, storedLastModified) {
  if (!file.ok) return file.errorName === "NotFoundError" ? { action: "missing" } : { action: "unreadable", errorName: file.errorName };
  if (storedLastModified === null || file.lastModified !== storedLastModified) return { action: "changed" };
  return { action: "write" };
}
// Step 3: what a failed write means.
function classifyWriteError(name) {
  if (name === "InvalidStateError" || name === "NoModificationAllowedError") return "locked";
  if (name === "NotFoundError") return "missing";
  if (name === "NotAllowedError" || name === "SecurityError") return "permission";
  return "error";
}
function failureMessage(kind, fileName, extra) {
  const n = '"' + fileName + '"';
  const safe = " Your text is safe in this container.";
  if (kind === "missing") return "The file " + n + " was renamed, moved or deleted." + safe;
  if (kind === "changed") return "The file " + n + " was changed outside NoteTaker since your last save. Saving now would overwrite those changes." + safe;
  if (kind === "locked") return "NoteTaker could not write to " + n + ". It may be open in another program, or it changed while saving. Nothing was overwritten." + safe;
  if (kind === "permission") return "NoteTaker needs your permission to save " + n + ".";
  if (kind === "linklost") return "The link to the file " + n + " was lost (browser data may have been cleared)." + safe + " Use Save As to link a file again.";
  if (kind === "samefile") return n + " is also linked to the container \"" + extra + "\". Saving from both will overwrite each other's text.";
  return "Saving " + n + " failed (" + extra + ")." + safe;
}
// ----- Phase 3: ordering, pinning, search -----
const byEdited = (a, b) => (b.lastEdited - a.lastEdited) || (b.createdAt - a.createdAt) || (a.id < b.id ? -1 : 1);
const byManual = (a, b) => (a.order - b.order) || (b.createdAt - a.createdAt) || (a.id < b.id ? -1 : 1);
// Display order: the pinned card first in BOTH modes, then the rest by the chosen mode ("edited" = newest edit first, anything else = manual order).
function displayOrder(cards, mode) {
  const cmp = mode === "edited" ? byEdited : byManual;
  return cards.filter((c) => c.pinned).sort(cmp).concat(cards.filter((c) => !c.pinned).sort(cmp));
}
// Cards stored before manual order existed keep their old (newest created first) position.
function assignMissingOrders(cards) { cards.forEach((c) => { if (c.order === null || c.order === undefined) c.order = -c.createdAt; }); return cards; }
function newCardOrder(cards) { return cards.length ? Math.min.apply(null, cards.map((c) => c.order)) - 1 : 0; }   // a new card goes to the top
// Move card `id` just before (after=false) or after (after=true) card `targetId` in the manual sequence; returns { id: newOrder } for every card, or null.
function manualMove(cards, id, targetId, after) {
  if (id === targetId) return null;
  const seq = cards.slice().sort(byManual);
  const from = seq.findIndex((c) => c.id === id); if (from < 0) return null;
  const moved = seq.splice(from, 1)[0];
  let to = seq.findIndex((c) => c.id === targetId); if (to < 0) return null;
  if (after) to += 1;
  seq.splice(to, 0, moved);
  const out = {}; seq.forEach((c, i) => { out[c.id] = i; });
  return out;
}
// Move one place up (-1) or down (+1) among the cards that are shown below the pinned card; null if it cannot move.
function manualMoveBy(cards, id, delta) {
  const rest = displayOrder(cards, "manual").filter((c) => !c.pinned);
  const i = rest.findIndex((c) => c.id === id), j = i + delta;
  if (i < 0 || j < 0 || j >= rest.length) return null;
  return manualMove(cards, id, rest[j].id, delta > 0);
}
// Pinning: only one card at a time. Returns { id: newPinnedValue } for the cards that change.
function pinChange(cards, id) {
  const target = cards.find((c) => c.id === id), out = {};
  if (!target) return out;
  if (target.pinned) { out[id] = false; return out; }
  cards.forEach((c) => { if (c.pinned) out[c.id] = false; });
  out[id] = true; return out;
}
function matchesQuery(card, query) {
  const q = String(query).trim().toLowerCase();
  return !q || card.title.toLowerCase().includes(q) || card.text.toLowerCase().includes(q);
}
// ===== </pure-logic> =====

const $ = (id) => document.getElementById(id);
const errStr = (e) => (e && e.name ? e.name : typeof e) + ": " + (e && e.message ? e.message : String(e));
const cards = new Map();          // id -> card (in memory, source of truth for the UI)
const els = new Map();            // id -> { root, title, body, meta, li, lock, small, status }
const handles = new Map();        // card id -> FileSystemFileHandle (in memory; also stored in IndexedDB "handles")
const busy = new Set();           // card ids with a save in progress
let lastHandle = null;            // most recent file saved to; used as the Save As starting folder
let sortMode = "manual";          // "manual" (default: same as the Phase 1 order until you move something) or "edited"
let pendingReorder = false;       // "last edited" order is applied once focus leaves the containers (never under your cursor)
let drag = null;                  // state of a drag in progress

// ---------- banners ----------
function banner(kind, text) {
  const d = document.createElement("div");
  d.className = "banner " + kind;
  d.textContent = text;
  $("banners").appendChild(d);
  return d;
}

// ---------- IndexedDB ----------
const DB_NAME = "notetaker", DB_VERSION = 1;
let dbPromise = null;
function openDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    let req;
    try { req = indexedDB.open(DB_NAME, DB_VERSION); } catch (e) { return reject(e); }
    req.onupgradeneeded = () => {
      const db = req.result;
      db.createObjectStore("cards", { keyPath: "id" });
      db.createObjectStore("handles");      // key = card id; used from Phase 2
      db.createObjectStore("meta");
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error("indexedDB open blocked"));
  });
  return dbPromise;
}
async function dbTx(stores, mode, fn) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(stores, mode);
    const r = fn(tx);
    tx.oncomplete = () => resolve(r && r.result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error("transaction aborted"));
  });
}
const dbAllCards = () => dbTx(["cards"], "readonly", (tx) => tx.objectStore("cards").getAll());
const dbPutCards = (list) => dbTx(["cards"], "readwrite", (tx) => { const s = tx.objectStore("cards"); list.forEach((c) => s.put(c)); });
const dbGetMeta = (key) => dbTx(["meta"], "readonly", (tx) => tx.objectStore("meta").get(key));
const dbPutMeta = (key, val) => dbTx(["meta"], "readwrite", (tx) => tx.objectStore("meta").put(val, key));
const dbPutHandle = (key, h) => dbTx(["handles"], "readwrite", (tx) => tx.objectStore("handles").put(h, key));
const dbAllHandles = () => dbTx(["handles"], "readonly", (tx) => { const st = tx.objectStore("handles"), k = st.getAllKeys(), v = st.getAll();
  return { get result() { return k.result.map((key, i) => [key, v.result[i]]); } }; });
const dbDeleteCard = (id) => dbTx(["cards", "handles"], "readwrite", (tx) => { tx.objectStore("cards").delete(id); tx.objectStore("handles").delete(id); });

// ---------- crash backup: every change is written to IndexedDB within ~250 ms ----------
const FLUSH_MS = 0;    // next event-loop turn: coalesces one burst of input events, but shrinks the loss window to a few ms (a 250 ms debounce lost text typed <150 ms before closing the tab)
const dirty = new Set();
let flushTimer = null, flushChain = Promise.resolve(), backupBroken = false;

function setBackup(state) {
  const el = $("backup");
  if (state === "ok")      { el.className = "ok";  el.textContent = "Backup: up to date"; }
  if (state === "pending") { el.className = "ok";  el.textContent = "Backup: writing…"; }
  if (state === "failed")  { el.className = "bad"; el.textContent = "BACKUP FAILED: text is not protected"; }
}
function markDirty(id) {
  dirty.add(id);
  if (!backupBroken) setBackup("pending");
  if (!flushTimer) flushTimer = setTimeout(flush, FLUSH_MS);   // not reset on each keystroke, so a long typing burst still flushes
}
function flush() {
  clearTimeout(flushTimer); flushTimer = null;
  flushChain = flushChain.then(async () => {
    if (!dirty.size) return;
    const ids = [...dirty]; dirty.clear();
    const batch = ids.map((id) => cards.get(id)).filter(Boolean);
    try {
      await dbPutCards(batch);
      backupBroken = false;
      if (!dirty.size) setBackup("ok");
    } catch (e) {
      ids.forEach((id) => dirty.add(id));      // keep them dirty so the next flush retries
      backupBroken = true; setBackup("failed");
      console.error("backup failed", e);
      flushTimer = flushTimer || setTimeout(flush, 2000);
    }
  });
  return flushChain;
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });
window.addEventListener("pagehide", () => { flush(); });

// ---------- UI ----------
function updateMeta(card) {
  const e = els.get(card.id); if (!e) return;
  const state = unsavedState(card);
  e.meta.textContent = "";
  const parts = [countWords(card.text) + " words", countChars(card.text) + " chars", "Edited " + formatStamp(card.lastEdited)];
  if (card.savedAt) parts.push("Saved " + formatStamp(card.savedAt).slice(11));
  parts.forEach((p) => { const s = document.createElement("span"); s.textContent = p; e.meta.appendChild(s); });
  if (state) {
    const b = document.createElement("span"); b.className = "badge";
    b.textContent = state === "never-saved" ? "Not saved to a file" : "Unsaved changes";
    e.meta.appendChild(b);
  }
}
function indexLabel(card) { return card.title.trim() || "Untitled"; }
function updateIndexItem(card) {
  const e = els.get(card.id); if (!e || !e.li) return;
  const t = e.li.querySelector(".t"); t.textContent = (card.locked ? "🔒 " : "") + indexLabel(card);
  const ic = e.li.querySelector(".ic"); if (ic) ic.textContent = card.pinned ? "▲" : card.collapsed ? "▸" : "●"; t.classList.toggle("untitled", !card.title.trim());
  const s = e.li.querySelector(".s"); s.textContent = "";
  const add = (txt, cls) => { const x = document.createElement("span"); x.textContent = txt; if (cls) x.className = cls; s.appendChild(x); };
  add(countWords(card.text) + " words"); add(formatStamp(card.lastEdited).slice(11, 16));
  const st = unsavedState(card); if (st) add(st === "never-saved" ? "no file" : "unsaved", "badge");
}
function buildIndexItem(card) {
  const li = document.createElement("li"); li.dataset.id = card.id;
  const ic = document.createElement("span"); ic.className = "ic"; ic.textContent = "●";
  const ib = document.createElement("div"); ib.className = "ib";
  const t = document.createElement("div"); t.className = "t"; const s = document.createElement("div"); s.className = "s";
  ib.append(t, s); li.append(ic, ib);
  li.addEventListener("click", () => goTo(card.id));
  return li;
}
function goTo(id) {
  const e = els.get(id); if (!e) return;
  e.root.scrollIntoView({ behavior: "smooth", block: "start" });

// No saved choice: follow the system setting. After the button is used: the choice is remembered (in this browser) and wins over the system.
function currentTheme() {
  const t = document.documentElement.getAttribute("data-theme");
  if (t === "dark" || t === "light") return t;
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function refreshThemeButton() {
  const dark = currentTheme() === "dark", b = $("themeBtn");
  b.textContent = dark ? "☀ Light" : "☾ Dark";
  const label = dark ? "Switch to light mode" : "Switch to dark mode";
  b.title = label; b.setAttribute("aria-label", label);
}
$("themeBtn").addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("notetaker-theme", next); } catch (e) { /* storage blocked: the choice lasts until the page is closed */ }
  refreshThemeButton();
});
if (window.matchMedia) { const mq = matchMedia("(prefers-color-scheme: dark)"); (mq.addEventListener ? mq.addEventListener("change", refreshThemeButton) : mq.addListener(refreshThemeButton)); }
refreshThemeButton();

// ---------- start-up ----------
(async function init() {
  try {
    const stored = await dbAllCards();
    stored.forEach((c) => cards.set(c.id, normalizeCard(c)));
    assignMissingOrders([...cards.values()]);
    try { const m = await dbGetMeta("sortMode"); if (m === "edited" || m === "manual") sortMode = m; } catch (e) { /* default */ }
    setBackup("ok");
    try { (await dbAllHandles()).forEach(([key, h]) => { if (key === "__last") lastHandle = h; else if (cards.has(key)) handles.set(key, h); }); }
    catch (e) { banner("err", "Could not restore the links to saved files (" + errStr(e) + "). Use Save As to link them again."); }
  } catch (e) {
    backupBroken = true; setBackup("failed");
    banner("err", "Browser storage is unavailable (" + errStr(e) + "). You can edit, but nothing is backed up.");
  }
  document.body.dataset.sort = sortMode;
  document.querySelectorAll('input[name="sort"]').forEach((r) => { r.checked = r.value === sortMode; });
  renderAll();
  // Step 5 of the routine, on load: a container linked to a file whose permission is not granted gets a "click to allow" prompt.
  for (const c of cards.values()) {
    if (!c.fileName) continue;
    const h = handles.get(c.id);
    if (!h) { showPanel(c, "linklost"); continue; }
    try { if ((await h.queryPermission({ mode: "readwrite" })) !== "granted") showPanel(c, "permission"); }
    catch (e) { showPanel(c, "error", errStr(e)); }
  }

  // Ask Chrome not to evict this site's data under storage pressure (best effort).
  if (navigator.storage && navigator.storage.persist) {
    try { const p = await navigator.storage.persist(); $("backup").title = p ? "Storage is persistent" : "Storage is best-effort (the browser may evict it under pressure)"; }
    catch (e) { /* ignore */ }
  }
  // Warn (do not block) if the app is already open in another tab: two tabs would overwrite each other's backup.
  if (navigator.locks) {
    navigator.locks.request("notetaker-instance", { ifAvailable: true }, (lock) => {
      if (!lock) { banner("warn", "NoteTaker is already open in another tab or window. Edits made in both places can overwrite each other. Close one of them."); return; }
      return new Promise(() => {});    // hold the lock until this page closes
    });
  }
})();
</script>
