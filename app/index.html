<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NoteTaker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="16x16 24x24 32x32 48x48 64x64">
<link rel="manifest" href="manifest.webmanifest">
<script>try { var t = localStorage.getItem("notetaker-theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) { /* storage blocked: follow the system setting */ }</script>
<style>
  /* ===== Theme tokens =====
     Default profile (personal brand), light, on :root. Other profiles override these through a data-profile attribute selector
     (:root[data-profile="..."]); light/dark is the data-theme attribute or the system setting, as before.
     Palette: Midnight #253D52, Warm gray #525254, Mist bg #EEF2F7, Muted blue #4880AE, Soft sky #A0C2DB, Mist gray #9A9AA4, Muted Blue Dark #325A7A */
  :root {
    --bg: #EEF2F7; --card: #FFFFFF; --field: #FFFFFF; --field-locked: #EEF2F7;
    --text: #253D52; --muted: #525254; --heading: #253D52;
    --line: #4880AE; --card-line: transparent;                        /* --line: borders of buttons and fields; --card-line: edge of cards, boxes and the header */
    --accent: #4880AE; --accent-bg: #EEF2F7; --focus: #4880AE;        /* never used as text colour: rings, drop line, focus */
    --active-bg: #EEF2F7; --icon: #4880AE;                                                /* the small symbols in the header list */
    --cta-bg: #253D52; --cta-text: #FFFFFF; --btn-bg: #325A7A; --btn-text: #FFFFFF; --btn-line: #325A7A;
    --sig: rgba(72, 128, 174, .14);                                   /* the decorative corner circle */
    --ok: #217a3c; --bad: #c62828;                                    /* page background only (backup line) */
    --warn: #9a5b00; --warn-bg: #fff4d6; --warn-line: #9a5b00; --err-bg: #fde4e4; --err-line: #c62828;
    --cardw: 1060px; --idxw: 528px; --texth: 400px; --fs: 14px; --hdr: 76px; --hdr-min: 76px;   /* --hdr = the real header height, set from the page (see below) */
    --radius-card: 14px; --radius-ctl: 8px; --radius-btn: 8px; --radius-field: 10px; --radius-area: 12px; --radius-line: 2px;
    --font-ui: Arial, Helvetica, sans-serif; --font-mono: Consolas, "Courier New", monospace;
    --fw-normal: 400; --fw-strong: 700; --fw-head: 700; --cta-size: 14px; --cta-weight: 400; --h1-size: 18px; --h1-lh: 22px;
    --logo-w: 190px; --logo-plate: transparent; --logo-plate-pad: 0;      /* only used by a profile that shows a logo */
    --circle: radial-gradient(circle 220px at calc(100% - 110px) 70px, var(--sig) 219px, transparent 220px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #253D52; --card: #325A7A; --field: #253D52; --field-locked: #325A7A;
      --text: #FFFFFF; --muted: #EEF2F7; --heading: #FFFFFF;
      --line: #A0C2DB; --accent: #A0C2DB; --accent-bg: #253D52; --focus: #A0C2DB; --active-bg: #253D52; --icon: #A0C2DB;
      --cta-bg: #A0C2DB; --cta-text: #253D52; --btn-bg: #EEF2F7; --btn-text: #253D52; --btn-line: #EEF2F7; --sig: rgba(160, 194, 219, .12);
      --ok: #6fcf8a; --bad: #ff8a80;
      --warn: #ffc766; --warn-bg: #3b3317; --warn-line: #ffc766; --err-bg: #3d1d1d; --err-line: #ff9d94;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #253D52; --card: #325A7A; --field: #253D52; --field-locked: #325A7A;
    --text: #FFFFFF; --muted: #EEF2F7; --heading: #FFFFFF;
    --line: #A0C2DB; --accent: #A0C2DB; --accent-bg: #253D52; --focus: #A0C2DB; --active-bg: #253D52; --icon: #A0C2DB;
    --cta-bg: #A0C2DB; --cta-text: #253D52; --btn-bg: #EEF2F7; --btn-text: #253D52; --btn-line: #EEF2F7; --sig: rgba(160, 194, 219, .12);
    --ok: #6fcf8a; --bad: #ff8a80;
    --warn: #ffc766; --warn-bg: #3b3317; --warn-line: #ffc766; --err-bg: #3d1d1d; --err-line: #ff9d94;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--circle) fixed, var(--bg); color: var(--text); font: 14px/1.4 var(--font-ui); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  header { position: sticky; top: 0; z-index: 5; min-height: var(--hdr-min); background: var(--circle) fixed, var(--bg); border-bottom: 1px solid var(--card-line);
           padding: 0 16px; display: grid; grid-template-columns: minmax(0, 1fr); align-content: center; row-gap: 6px; }
  #logoSlot { display: none; flex: none; align-self: flex-start; margin: 0 0 14px 0; }   /* a profile that has a logo draws it here: top of the container-list column, left-aligned */
  .hrow { display: flex; flex-wrap: nowrap; gap: 12px; align-items: center; min-width: 0; }
  .hright { display: flex; align-items: center; gap: 12px; margin-left: auto; }
  h1 { font-size: var(--h1-size); line-height: var(--h1-lh); margin: 0; font-weight: var(--fw-head); color: var(--heading); }
  button { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: var(--radius-btn);
           background: transparent; color: var(--text); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--cta-bg); border-color: var(--cta-bg); color: var(--cta-text); font-size: var(--cta-size); font-weight: var(--cta-weight); }
  button.btn-open, button.btn-save { background: var(--btn-bg); border-color: var(--btn-line); color: var(--btn-text); }
  #themeBtn { white-space: nowrap; }
  /* profile switch: a label and a two-button group (the pressed one is filled) */
  #profileBox { display: inline-flex; align-items: center; gap: 8px; }
  #profileBox[hidden] { display: none; }
  #profileLabel { font-size: 12px; color: var(--muted); font-weight: var(--fw-strong); white-space: nowrap; }
  .segbtns { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-btn); }
  .segbtns button { border: 0; border-radius: 0; padding: 4px 12px; font-weight: var(--fw-strong); white-space: nowrap; }
  .segbtns button:first-child { border-radius: var(--radius-btn) 0 0 var(--radius-btn); }
  .segbtns button:last-child { border-radius: 0 var(--radius-btn) var(--radius-btn) 0; }
  .segbtns button[aria-pressed="true"] { background: var(--btn-bg); color: var(--btn-text); }
  .segbtns button:hover:not(:disabled):not([aria-pressed="true"]) { background: var(--accent-bg); }
  #count, #backup { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #backup { min-width: 10em; }                      /* reserve the width of the usual texts so the buttons beside it do not shift as the text changes */
  #backup.ok { color: var(--ok); } #backup.bad { color: var(--bad); font-weight: var(--fw-strong); }
  .banner { margin: 10px 16px 0; padding: 8px 12px; border-radius: var(--radius-ctl); border: 1px solid; display: flex; gap: 12px; align-items: flex-start; white-space: pre-line; }
  .banner > span { flex: 1; }
  .banner .bx { flex: none; }
  .banner.warn { background: var(--warn-bg); border-color: var(--warn-line); }
  .banner.err { background: var(--err-bg); border-color: var(--err-line); }
  #empty { margin: 32px 16px; color: var(--muted); }
  #layout { display: grid; grid-template-columns: minmax(0, var(--cardw)) minmax(240px, var(--idxw)); justify-content: center;
            gap: 16px; padding: 14px 16px 60px; align-items: start; }
  #grid { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  @media (max-width: 900px) { #layout { grid-template-columns: minmax(0, 1fr); } #side { position: static; max-height: none; } }
  .card { background: var(--card); border: 1px solid var(--card-line); border-radius: var(--radius-card); padding: 10px; display: flex; flex-direction: column; gap: 6px;
          scroll-margin-top: calc(var(--hdr) + 12px); }
  .card.flash { animation: flash 1.1s ease-out; }
  @keyframes flash { 0% { background: var(--accent-bg); } 100% { background: var(--card); } }
  .title { width: 100%; font: inherit; font-weight: var(--fw-strong); padding: 4px 6px; border: 1px solid var(--line); border-radius: var(--radius-field);
           background: var(--field); color: var(--text); }
  .btns { display: flex; flex-wrap: wrap; gap: 4px; }
  textarea.body { width: 100%; height: var(--texth); resize: vertical; overflow: auto; padding: 8px; font: var(--fs)/1.45 var(--font-mono);
                  border: 1px solid var(--line); border-radius: var(--radius-area); background: var(--field); color: var(--text); }
  .btnwrap { position: relative; display: inline-block; }
  .toast { position: absolute; left: 0; top: calc(100% + 3px); z-index: 4; white-space: nowrap; pointer-events: none;
           background: var(--text); color: var(--bg); padding: 2px 8px; border-radius: var(--radius-ctl); font-size: 12px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
  .badge { color: var(--warn); font-weight: var(--fw-strong); }
  .titlerow { display: flex; gap: 6px; align-items: center; }
  .titlerow .title { flex: 1; min-width: 0; }
  .title[readonly] { background: var(--field-locked); }
  ::placeholder { color: var(--muted); opacity: 1; }
  .lock { flex: none; font-size: 15px; }
  .small { font-size: 11px; color: var(--muted); margin-top: -2px; }
  .cardstatus:empty { display: none; }
  .panel { border: 1px solid var(--err-line); background: var(--err-bg); border-radius: var(--radius-ctl); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .panel.warn { border-color: var(--warn-line); background: var(--warn-bg); }
  .panel .pmsg { font-size: 13px; }
  .panel .pbtns { display: flex; flex-wrap: wrap; gap: 6px; }
  .card[hidden], #index li[hidden] { display: none !important; }
  .card.pinned { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card.collapsed .small, .card.collapsed textarea.body, .card.collapsed .meta { display: none; }
  .card.dragging { opacity: .45; }
  .reorder { display: inline-flex; gap: 4px; align-items: center; flex: none; }
  .reorder button { padding: 2px 8px; }
  .grip { cursor: grab; user-select: none; touch-action: none; flex: none; padding: 2px 4px; color: var(--muted); font-size: 16px; line-height: 1; }
  .grip:active { cursor: grabbing; }
  .grip.off { opacity: .35; cursor: not-allowed; }
  body[data-sort="edited"] .reorder, body[data-sort="edited"] .grip { display: none; }
  body.is-dragging { user-select: none; cursor: grabbing; }
  #dropline { position: fixed; height: 4px; border-radius: var(--radius-line); background: var(--accent); z-index: 20; pointer-events: none; display: none; }
  #q { width: 100%; font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: var(--radius-btn); background: var(--field); color: var(--text); }
  .sortrow { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
  .sortrow label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
  input[type="radio"] { appearance: none; -webkit-appearance: none; flex: none; width: 16px; height: 16px; margin: 0; border: 2px solid var(--line); border-radius: 50%; background: var(--field); display: inline-grid; place-content: center; cursor: pointer; }   /* own drawing so the ring is a token colour (the browser's grey ring failed 3:1 in dark) */
  input[type="radio"]::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); transform: scale(0); }
  input[type="radio"]:checked::before { transform: scale(1); }
  .nomatch { color: var(--muted); font-size: 12px; padding: 6px 8px; }
  #side { position: sticky; top: calc(var(--hdr) + 10px); max-height: calc(100vh - var(--hdr) - 24px); display: flex; flex-direction: column; min-width: 0; }
  #side .box { background: var(--card); border: 1px solid var(--card-line); border-radius: var(--radius-card); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  #side h2 { font-size: 13px; margin: 0; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  #index { list-style: none; margin: 0; padding: 0; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
  #index li { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-radius: var(--radius-card); cursor: pointer; border: 1px solid transparent; }
  #index li:hover { border-color: var(--line); }
  #index li.active { background: var(--active-bg); border-color: var(--accent); }
  #index .ic { width: 18px; text-align: center; flex: none; color: var(--icon); font-size: 13px; }
  #index .ib { min-width: 0; flex: 1; }
  #index .t { font-weight: var(--fw-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #index .t.untitled { font-weight: var(--fw-normal); font-style: italic; color: var(--muted); }
  #index .s { font-size: 11px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
</style>
<!-- Optional profile file. Blocking on purpose: when present it adds its look before the first paint. When it is absent this request fails (one 404 line in the server log and the console, nothing else) and the app runs in Default. -->
<script src="mint-profile.js" onerror="window.__mintMissing = true"></script>
<script>
// ===== <profile-logic> (no DOM access; unit-tested by Testing/profiles-phase3-unit.mjs) =====
const PROFILE_KEY = "notetaker-profile";
// stored = what localStorage holds ("mint", "default", anything else, or null); mintAvailable = mint-profile.js loaded.
// A stored "mint" is kept (not rewritten) when the file is missing: the Default look is shown and fellBack says so.
function resolveProfile(stored, mintAvailable) {
  if (stored === "mint") return mintAvailable ? { profile: "mint", fellBack: false } : { profile: "default", fellBack: true };
  return { profile: "default", fellBack: false };
}
function themeLabel(isDark) {
  return isDark ? { text: "\u2600 Light", title: "Switch to light mode" } : { text: "\u263E Dark", title: "Switch to dark mode" };
}
// ===== </profile-logic> =====
(function () {
  var stored = null; try { stored = localStorage.getItem(PROFILE_KEY); } catch (e) { /* storage blocked: Default */ }
  var r = resolveProfile(stored, !!window.NoteTakerMint);
  window.__profileState = { stored: stored, resolved: r.profile, fellBack: r.fellBack, available: !!window.NoteTakerMint };
  if (r.profile === "mint") document.documentElement.setAttribute("data-profile", "mint");
})();
</script>
</head>
<body>
<header>
  <div class="hrow" id="hrow1">
    <h1>NoteTaker</h1>
  </div>
  <div class="hrow" id="hrow2">
    <span id="backup" class="ok busy">Backup: starting…</span>
    <button id="newCard" class="primary">New container</button>
    <button id="openBtn" class="btn-open" type="button" title="Open an existing .txt or .md file into a new container">Open file…</button>
    <span id="count"></span>
    <div class="hright">
      <div id="profileBox" hidden>
        <span id="profileLabel">Profile</span>
        <div class="segbtns" role="group" aria-label="Profile">
          <button type="button" data-profile="default" aria-pressed="true">Default</button>
          <button type="button" data-profile="mint" aria-pressed="false">Mint</button>
        </div>
      </div>
      <button id="themeBtn" type="button">Dark</button>
    </div>
  </div>
</header>
<div id="banners"></div>
<div id="dropline"></div>
<div id="empty" hidden>No containers yet. Click <b>New container</b> to start.</div>
<div id="layout">
  <main id="grid"></main>
  <aside id="side">
    <span id="logoSlot"></span>
    <div class="box">
      <h2>Containers</h2>
      <input id="q" type="search" placeholder="Search titles and text" aria-label="Search containers" autocomplete="off">
      <div class="sortrow" role="radiogroup" aria-label="Order">
        <label><input type="radio" name="sort" value="edited"> Sort by last edited</label>
        <label><input type="radio" name="sort" value="manual"> Manual order</label>
      </div>
      <ul id="index"></ul>
      <div id="nomatchSide" class="nomatch" hidden>No containers match.</div>
    </div>
  </aside>
</div>

<script>
"use strict";

// ===== <pure-logic> (no DOM or storage access; unit-tested by Testing/phase1-unit.mjs) =====
function countWords(text) { const t = text.trim(); return t ? t.split(/\s+/).length : 0; }
function countChars(text) { return Array.from(text).length; }           // includes spaces
function pad2(n) { return String(n).padStart(2, "0"); }
function formatStamp(ms) {
  const d = new Date(ms);
  return d.getFullYear() + "/" + pad2(d.getMonth() + 1) + "/" + pad2(d.getDate()) + " " +
         pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
}
// "" = nothing to flag, "never-saved" = text exists but was never saved to a file, "unsaved" = differs from last saved text
function unsavedState(card) {
  if (card.savedText === null) return card.text === "" ? "" : "never-saved";
  return card.text !== card.savedText ? "unsaved" : "";
}
function newCard(now, id) {
  return { id: id, title: "", text: "", createdAt: now, lastEdited: now,
           savedText: null, pinned: false, collapsed: false };
}
const CARD_DEFAULTS = { title: "", text: "", savedText: null, pinned: false, collapsed: false, locked: false, fileName: null, lastModified: null, savedAt: null, order: null, eol: "lf", bom: false };
function normalizeCard(c) { return Object.assign({}, CARD_DEFAULTS, c); }   // cards stored by an earlier phase gain the new fields
// ----- Phase 4: opening existing files without changing them by accident -----
const MAX_OPEN_BYTES = 10 * 1024 * 1024;
// Decode file bytes as UTF-8. Refuses (ok:false) anything that is not valid UTF-8, so a file in another encoding is never "repaired" and saved back damaged.
// Remembers a leading byte-order mark and the line-ending style (CRLF or LF; mixed files use the majority) so a save can put them back.
function decodeFileBytes(bytes) {
  const u8 = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  const bom = u8.length >= 3 && u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF;
  let text;
  try { text = new TextDecoder("utf-8", { fatal: true }).decode(bom ? u8.subarray(3) : u8); }
  catch (e) { return { ok: false, reason: "not-utf8" }; }
  const crlf = (text.match(/\r\n/g) || []).length;
  const lf = (text.match(/\n/g) || []).length - crlf;
  const cr = (text.replace(/\r\n/g, "").match(/\r/g) || []).length;       // a lone CR (old Mac style) counts as a line break
  const eol = crlf > lf + cr ? "crlf" : "lf";
  const mixed = cr > 0 || (crlf > 0 && lf > 0);                  // anything but one consistent style: the save will make it consistent, so say so
  return { ok: true, text: text.replace(/\r\n?/g, "\n"), bom: bom, eol: eol, mixed: mixed };
}
// The text as it goes into the file: the container holds "\n" line breaks; the file gets its original style and byte-order mark back.
function encodeForFile(text, fmt) {
  fmt = fmt || {};
  return (fmt.bom ? "﻿" : "") + (fmt.eol === "crlf" ? text.replace(/\n/g, "\r\n") : text);
}
function describeOpenRefusal(name, reason, size, detail) {
  const n = '"' + name + '"';
  if (reason === "too-big") return n + " is " + (size / 1048576).toFixed(1) + " MB, over the " + (MAX_OPEN_BYTES / 1048576) + " MB limit for opening a file here, so it was not opened.";
  if (reason === "not-utf8") return n + " is not UTF-8 text (it may use another encoding, or not be a text file), so it was not opened. Opening and saving it could damage it.";
  return n + " could not be read (" + (detail || "unknown error") + "), so it was not opened.";
}
const RESERVED_NAME = /^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])$/i;
// File-name-safe version of a title: removes \ / : * ? " < > | and control characters, trims spaces, removes trailing dots,
// caps at 100 characters, and prefixes "_" to Windows reserved names (CON, PRN, AUX, NUL, COM1-9, LPT1-9). Returns "" if nothing is left.
function sanitizeTitle(title) {
  const trimEnd = (x) => x.replace(/[\s.]+$/, "");
  let s = String(title).replace(/[\\/:*?"<>|\u0000-\u001f\u007f]/g, "").replace(/^\s+/, "");
  s = trimEnd(s);
  s = trimEnd(Array.from(s).slice(0, 100).join(""));
  if (!s) return "";
  if (RESERVED_NAME.test(s.split(".")[0])) s = "_" + s;
  return s;
}
function defaultFileName(title, now) {
  const base = sanitizeTitle(title);
  if (!base) {
    const d = new Date(now);
    return "User_Text_" + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + "_" + pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds()) + ".txt";
  }
  return /\.(txt|md)$/i.test(base) ? base : base + ".txt";
}
function stripExtension(name) { const r = name.replace(/\.[^./\\]+$/, ""); return r || name; }
// Steps 1 and 2 of the save routine. file = { ok: true, lastModified } or { ok: false, errorName }.
function checkBeforeWrite(file, storedLastModified) {
  if (!file.ok) return file.errorName === "NotFoundError" ? { action: "missing" } : { action: "unreadable", errorName: file.errorName };
  if (storedLastModified === null || file.lastModified !== storedLastModified) return { action: "changed" };
  return { action: "write" };
}
// Step 3: what a failed write means.
function classifyWriteError(name) {
  if (name === "InvalidStateError" || name === "NoModificationAllowedError") return "locked";
  if (name === "NotFoundError") return "missing";
  if (name === "NotAllowedError" || name === "SecurityError") return "permission";
  return "error";
}
function failureMessage(kind, fileName, extra) {
  const n = '"' + fileName + '"';
  const safe = " Your text is safe in this container.";
  if (kind === "missing") return "The file " + n + " was renamed, moved or deleted." + safe;
  if (kind === "changed") return "The file " + n + " was changed outside NoteTaker since your last save. Saving now would overwrite those changes." + safe;
  if (kind === "locked") return "NoteTaker could not write to " + n + ". It may be open in another program, or it changed while saving. Nothing was overwritten." + safe;
  if (kind === "permission") return "NoteTaker needs your permission to save " + n + ".";
  if (kind === "linklost") return "The link to the file " + n + " was lost (browser data may have been cleared)." + safe + " Use Save As to link a file again.";
  if (kind === "samefile") return n + " is also linked to the container \"" + extra + "\". Saving from both will overwrite each other's text.";
  if (kind === "eolmixed") return n + " had mixed or unusual line endings. When you save, every line ending will be written as " + extra + ".";

  if (save) dbPutMeta("sortMode", sortMode).catch((e) => banner("err", "Could not remember the order setting (" + errStr(e) + ")."));
  applyOrder();
}
document.querySelectorAll('input[name="sort"]').forEach((r) => r.addEventListener("change", () => { if (r.checked) setSortMode(r.value, true); }));
$("q").addEventListener("input", applyFilter);
$("q").addEventListener("keydown", (ev) => { if (ev.key === "Escape") { $("q").value = ""; applyFilter(); } });

// ----- drag and drop (pointer based, so it works the same with mouse and pen, and can scroll the page while dragging) -----
function dragTargets() { return [...$("grid").children].filter((k) => !k.hidden && !k.classList.contains("dragging") && !k.classList.contains("pinned")); }
function dragUpdate() {
  if (!drag) return;
  const y = drag.y, kids = dragTargets(); if (!kids.length) { drag.target = null; $("dropline").style.display = "none"; return; }
  let target = kids[kids.length - 1], after = true;
  for (const k of kids) { const r = k.getBoundingClientRect(); if (y < r.top + r.height / 2) { target = k; after = false; break; } }
  const r = target.getBoundingClientRect(), dl = $("dropline");
  drag.target = target.dataset.id; drag.after = after;
  dl.style.display = "block"; dl.style.left = r.left + "px"; dl.style.width = r.width + "px"; dl.style.top = ((after ? r.bottom + 5 : r.top - 9)) + "px";
}
function dragLoop() {
  if (!drag) return;
  const edge = 70; let dy = 0;
  if (drag.y < headerPx() + edge) dy = -Math.ceil((headerPx() + edge - drag.y) / 4);
  else if (drag.y > innerHeight - edge) dy = Math.ceil((drag.y - (innerHeight - edge)) / 4);
  if (dy) { window.scrollBy(0, dy); dragUpdate(); }
  drag.raf = requestAnimationFrame(dragLoop);
}
function startDrag(ev, card) {
  if (ev.button !== 0 || sortMode !== "manual" || searchActive() || card.pinned || drag) return;
  ev.preventDefault();
  const e = els.get(card.id);
  drag = { id: card.id, target: null, after: false, y: ev.clientY, grip: e.grip, pid: ev.pointerId, raf: 0 };
  e.root.classList.add("dragging"); document.body.classList.add("is-dragging");
  try { e.grip.setPointerCapture(ev.pointerId); } catch (err) { /* ignore */ }
  // Listen on the document, not the grip: it does not depend on pointer capture, and keeps working if the pointer leaves the window.
  document.addEventListener("pointermove", onDragMove); document.addEventListener("pointerup", onDragEnd); document.addEventListener("pointercancel", onDragCancel);
  dragUpdate(); drag.raf = requestAnimationFrame(dragLoop);
}
function onDragMove(ev) { if (drag) { drag.y = ev.clientY; dragUpdate(); } }
function endDragState() {
  if (!drag) return null;
  const d = drag; drag = null; cancelAnimationFrame(d.raf);
  document.removeEventListener("pointermove", onDragMove); document.removeEventListener("pointerup", onDragEnd); document.removeEventListener("pointercancel", onDragCancel);
  try { d.grip.releasePointerCapture(d.pid); } catch (err) { /* ignore */ }
  const e = els.get(d.id); if (e) e.root.classList.remove("dragging");
  document.body.classList.remove("is-dragging"); $("dropline").style.display = "none";
  return d;
}
function onDragEnd() {
  const d = endDragState(); if (!d || !d.target) return;
  commitManual(manualMove([...cards.values()], d.id, d.target, d.after));
  ensureVisible(d.id);
}
function onDragCancel() { endDragState(); }
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && drag) endDragState(); });

// ---------- saving to files ----------
function refreshTitleUi(card) {
  const e = els.get(card.id); if (!e) return;
  e.title.value = card.title; e.title.readOnly = !!card.locked;
  e.lock.hidden = !card.locked; e.small.hidden = !!card.locked;
}
function clearPanel(card) { const e = els.get(card.id); if (e) e.status.textContent = ""; }
function showPanel(card, kind, extra) {
  const e = els.get(card.id); if (!e) return;
  const name = card.fileName || card.title || "this file";
  e.status.textContent = "";
  const p = document.createElement("div"); p.className = "panel" + (kind === "samefile" || kind === "eolmixed" ? " warn" : ""); p.setAttribute("role", "alert"); p.dataset.kind = kind;
  const m = document.createElement("div"); m.className = "pmsg"; m.textContent = failureMessage(kind, name, extra); p.appendChild(m);
  const row = document.createElement("div"); row.className = "pbtns"; p.appendChild(row);
  const add = (label, fn) => { const b = document.createElement("button"); b.type = "button"; b.textContent = label; b.addEventListener("click", () => fn(b)); row.appendChild(b); };
  const asNew = () => add("Save As new file", (b) => saveAs(card, { btn: b }));
  if (kind === "missing") { asNew(); add("Re-create file here", (b) => saveCard(card, { force: true, btn: b })); }
  else if (kind === "changed") { asNew(); add("Overwrite anyway", (b) => saveCard(card, { force: true, btn: b })); }
  else if (kind === "locked") { asNew(); add("Try again", (b) => saveCard(card, { btn: b })); }
  else if (kind === "permission") { add("Allow saving", (b) => allowSaving(card, b)); asNew(); }
  else if (kind === "linklost") { asNew(); }
  else if (kind === "error") { asNew(); add("Try again", (b) => saveCard(card, { btn: b })); }
  add("Dismiss", () => clearPanel(card));
  e.status.appendChild(p);
  ensureVisible(card.id);
}
async function allowSaving(card, btn) {
  const h = handles.get(card.id); if (!h) return;
  try {
    const p = await h.requestPermission({ mode: "readwrite" });
    if (p === "granted") { clearPanel(card); toastAt(btn, "Allowed"); } else toastAt(btn, "Not allowed", 2000);
  } catch (err) { showPanel(card, "error", errStr(err)); }
}

// Steps 3 and 4 of the save routine: write the text, then remember the file's new lastModified.
async function writeCard(card, h) {
  const text = card.text;
  try {
    const w = await h.createWritable(); await w.write(encodeForFile(text, { eol: card.eol, bom: card.bom })); await w.close();
  } catch (err) {
    const kind = classifyWriteError(err && err.name);
    showPanel(card, kind, errStr(err)); console.error("write failed", err);
    return false;
  }
  try { card.lastModified = (await h.getFile()).lastModified; } catch (err) { card.lastModified = null; }
  card.savedText = text; card.savedAt = Date.now();
  markDirty(card.id); updateMeta(card); updateIndexItem(card);
  return true;
}

// The five-step routine for a container that is already linked to a file.
async function saveCard(card, opts) {
  opts = opts || {};
  if (busy.has(card.id)) return;
  const h = handles.get(card.id);
  if (!h) return saveAs(card, opts);                 // never saved: the first Save is a Save As
  busy.add(card.id);
  try {
    clearPanel(card);
    // 5. permission (asked here, inside the click, if it is not already granted)
    let perm;
    try {
      perm = await h.queryPermission({ mode: "readwrite" });
      if (perm === "prompt") perm = await h.requestPermission({ mode: "readwrite" });
    } catch (err) { perm = "denied"; }
    if (perm !== "granted") { showPanel(card, "permission"); return false; }
    // 1 and 2. does the file still exist, and is it unchanged since our last save?
    let file;
    try { const f = await h.getFile(); file = { ok: true, lastModified: f.lastModified }; }
    catch (err) { file = { ok: false, errorName: err && err.name }; }
    const decision = checkBeforeWrite(file, card.lastModified);
    if (!opts.force) {
      if (decision.action === "missing") { showPanel(card, "missing"); return false; }
      if (decision.action === "unreadable") { showPanel(card, classifyWriteError(decision.errorName), decision.errorName); return false; }
      if (decision.action === "changed") { showPanel(card, "changed"); return false; }
    }
    // 3 and 4.
    const ok = await writeCard(card, h);
    if (ok) toastAt(opts.btn, "Saved");
    return ok;
  } finally { busy.delete(card.id); }
}

async function saveAs(card, opts) {
  opts = opts || {};
  if (busy.has(card.id)) return;
  if (typeof window.showSaveFilePicker !== "function") { showPanel(card, "error", "this browser cannot save to files"); return false; }
  const base = { suggestedName: defaultFileName(card.title, Date.now()), types: [{ description: "Text files", accept: { "text/plain": [".txt", ".md"] } }], excludeAcceptAllOption: true };
  const fallback = Object.assign({ id: "notetaker", startIn: "documents" }, base);
  let h;
  try {
    // Start in the folder of the last saved file (to be checked by hand: does this survive a restart?); otherwise Documents.
    try { h = await window.showSaveFilePicker(lastHandle ? Object.assign({ startIn: lastHandle }, base) : fallback); }
    catch (err) { if (err && err.name === "AbortError") return false; h = await window.showSaveFilePicker(fallback); }
  } catch (err) {
    if (err && err.name === "AbortError") return false;       // cancelled: nothing changes and the title stays editable
    showPanel(card, "error", errStr(err)); return false;
  }
  busy.add(card.id);
  try {
    clearPanel(card);
    handles.set(card.id, h); lastHandle = h;
    card.fileName = h.name; card.title = stripExtension(h.name); card.locked = true; card.lastEdited = Date.now();
    refreshTitleUi(card);
    try { await dbPutHandle(card.id, h); await dbPutHandle("__last", h); }
    catch (err) { banner("err", "Could not remember the link to \"" + h.name + "\" (" + errStr(err) + "). It will need Save As again after a restart."); }
    try { card.lastModified = (await h.getFile()).lastModified; } catch (err) { card.lastModified = null; }
    markDirty(card.id);
    const ok = await writeCard(card, h);                    // the dialog already confirmed any replace, so no change check here
    if (ok) toastAt(opts.btn, "Saved");
    // warn if another container is linked to the same file
    for (const [otherId, oh] of handles) {
      if (otherId === card.id) continue;
      let same = false; try { same = await oh.isSameEntry(h); } catch (err) { /* ignore */ }
      if (same) { const other = cards.get(otherId); if (other) { showPanel(card, "samefile", other.title || "Untitled"); showPanel(other, "samefile", card.title || "Untitled"); } break; }
    }
    return ok;
  } finally { busy.delete(card.id); }
}

// ---------- opening existing files ----------
let opening = false;
// Opens one file into a new, linked container. Returns { status: "opened" | "already" | "refused", id, message }.
async function openOne(h) {
  for (const [id, oh] of handles) {                       // already open in a container: show that one, do not make a second link to the same file
    let same = false; try { same = await oh.isSameEntry(h); } catch (err) { /* ignore */ }
    if (same) return { status: "already", id: id };
  }
  let file, buf;
  try { file = await h.getFile(); } catch (err) { return { status: "refused", message: describeOpenRefusal(h.name, "unreadable", 0, err && err.name) }; }
  if (file.size > MAX_OPEN_BYTES) return { status: "refused", message: describeOpenRefusal(h.name, "too-big", file.size) };
  try { buf = await file.arrayBuffer(); } catch (err) { return { status: "refused", message: describeOpenRefusal(h.name, "unreadable", 0, err && err.name) }; }
  const dec = decodeFileBytes(new Uint8Array(buf));
  if (!dec.ok) return { status: "refused", message: describeOpenRefusal(h.name, dec.reason) };

  const c = newCard(Date.now(), crypto.randomUUID());
  Object.assign(c, { title: stripExtension(h.name), text: dec.text, savedText: dec.text, locked: true, fileName: h.name,
                     lastModified: file.lastModified, eol: dec.eol, bom: dec.bom, order: newCardOrder([...cards.values()]) });
  cards.set(c.id, c); handles.set(c.id, h); lastHandle = h;
  try { await dbPutHandle(c.id, h); await dbPutHandle("__last", h); }
  catch (err) { banner("err", "Could not remember the link to \"" + h.name + "\" (" + errStr(err) + "). It will need to be opened again after a restart."); }
  const root = buildCard(c);
  $("grid").appendChild(root); $("index").appendChild(els.get(c.id).li);
  applyFilter(); applyOrder(); markDirty(c.id); flush();
  if (dec.mixed) showPanel(c, "eolmixed", dec.eol === "crlf" ? "CRLF (Windows)" : "LF");
  return { status: "opened", id: c.id };
}
async function openFiles(btn) {
  if (opening) return;
  if (typeof window.showOpenFilePicker !== "function") { banner("err", "This browser cannot open files this way."); return; }
  opening = true;
  try {
    const base = { multiple: true, types: [{ description: "Text files", accept: { "text/plain": [".txt", ".md"] } }], excludeAcceptAllOption: true };
    const fallback = Object.assign({ id: "notetaker", startIn: "documents" }, base);
    let picked;
    try {
      try { picked = await window.showOpenFilePicker(lastHandle ? Object.assign({ startIn: lastHandle }, base) : fallback); }
      catch (err) { if (err && err.name === "AbortError") return; picked = await window.showOpenFilePicker(fallback); }
    } catch (err) {
      if (!(err && err.name === "AbortError")) banner("err", "Could not show the file dialog (" + errStr(err) + ").");
      return;
    }
    if ($("q").value) { $("q").value = ""; applyFilter(); }          // an opened container must be visible
    const problems = []; let firstId = null, opened = 0, already = 0;
    for (const h of picked) {
      const r = await openOne(h);
      if (r.id && !firstId) firstId = r.id;
      if (r.status === "opened") opened++; else if (r.status === "already") already++; else problems.push(r.message);
    }
    if (problems.length) banner("warn", problems.join("\n"));
    if (firstId) goTo(firstId);
    if (already) toastAt(btn, opened ? already + " already open" : "Already open", 2200);
  } finally { opening = false; }
}
$("openBtn").addEventListener("click", (ev) => openFiles(ev.currentTarget));

function addCard() {
  const c = newCard(Date.now(), crypto.randomUUID());
  c.order = newCardOrder([...cards.values()]);
  cards.set(c.id, c);
  if ($("q").value) $("q").value = "";          // a new container must be visible, so the search is cleared
  const root = buildCard(c);
  $("grid").appendChild(root); $("index").appendChild(els.get(c.id).li);
  applyFilter(); applyOrder();
  markDirty(c.id); flush();
  els.get(c.id).title.focus();
  root.scrollIntoView({ behavior: "smooth", block: "start" }); holdActive(c.id);
}
$("newCard").addEventListener("click", addCard);

// ---------- light / dark mode ----------
// No saved choice: follow the system setting. After the button is used: the choice is remembered (in this browser) and wins over the system.
function currentTheme() {
  const t = document.documentElement.getAttribute("data-theme");
  if (t === "dark" || t === "light") return t;
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function refreshThemeButton() {
  const dark = currentTheme() === "dark", b = $("themeBtn");
  const l = themeLabel(dark);
  b.textContent = l.text; b.title = l.title; b.setAttribute("aria-label", l.title);
}
$("themeBtn").addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("notetaker-theme", next); } catch (e) { /* storage blocked: the choice lasts until the page is closed */ }
  refreshThemeButton();
});
if (window.matchMedia) { const mq = matchMedia("(prefers-color-scheme: dark)"); (mq.addEventListener ? mq.addEventListener("change", refreshThemeButton) : mq.addListener(refreshThemeButton)); }
refreshThemeButton();

// ---------- header height ----------
// --hdr (used for scroll offsets and the list column's sticky position) always equals the header's real height, whatever the profile, theme or font.
if (window.ResizeObserver) new ResizeObserver(() => document.documentElement.style.setProperty("--hdr", headerPx() + "px")).observe(document.querySelector("header"));
document.documentElement.style.setProperty("--hdr", headerPx() + "px");

// ---------- profile (Default | Mint) ----------
// Mint is optional: the control is only offered when mint-profile.js loaded. The choice is remembered (in this browser), like the theme.
function currentProfile() { return document.documentElement.getAttribute("data-profile") === "mint" ? "mint" : "default"; }
function refreshProfileControl() {
  const box = $("profileBox"), on = currentProfile();
  box.hidden = !window.NoteTakerMint;
  box.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.profile === on)));
}
function applyProfile(p) {
  if (p === "mint" && window.NoteTakerMint) document.documentElement.setAttribute("data-profile", "mint"); else document.documentElement.removeAttribute("data-profile");
  try { localStorage.setItem(PROFILE_KEY, currentProfile()); } catch (e) { /* storage blocked: the choice lasts until the page is closed */ }
  refreshProfileControl();
}
$("profileBox").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => applyProfile(b.dataset.profile)));
refreshProfileControl();

// ---------- start-up ----------
(async function init() {
  try {
    const stored = await dbAllCards();
    stored.forEach((c) => cards.set(c.id, normalizeCard(c)));
    assignMissingOrders([...cards.values()]);
    try { const m = await dbGetMeta("sortMode"); if (m === "edited" || m === "manual") sortMode = m; } catch (e) { /* default */ }
    setBackup("ok");
    try { (await dbAllHandles()).forEach(([key, h]) => { if (key === "__last") lastHandle = h; else if (cards.has(key)) handles.set(key, h); }); }
    catch (e) { banner("err", "Could not restore the links to saved files (" + errStr(e) + "). Use Save As to link them again."); }
  } catch (e) {
    backupBroken = true; setBackup("failed");
    banner("err", "Browser storage is unavailable (" + errStr(e) + "). You can edit, but nothing is backed up.");
  }
  document.body.dataset.sort = sortMode;
  document.querySelectorAll('input[name="sort"]').forEach((r) => { r.checked = r.value === sortMode; });
  renderAll();
  if (window.__profileState && window.__profileState.fellBack) banner("warn", "The Mint profile file (mint-profile.js) was not found, so the Default look is shown. Your Mint choice is kept and applies again when the file is back.");
  // Step 5 of the routine, on load: a container linked to a file whose permission is not granted gets a "click to allow" prompt.
  for (const c of cards.values()) {
    if (!c.fileName) continue;
    const h = handles.get(c.id);
    if (!h) { showPanel(c, "linklost"); continue; }
    try { if ((await h.queryPermission({ mode: "readwrite" })) !== "granted") showPanel(c, "permission"); }
    catch (e) { showPanel(c, "error", errStr(e)); }
  }

  // Ask Chrome not to evict this site's data under storage pressure (best effort).
  if (navigator.storage && navigator.storage.persist) {
    try { const p = await navigator.storage.persist(); $("backup").title = p ? "Storage is persistent" : "Storage is best-effort (the browser may evict it under pressure)"; }
    catch (e) { /* ignore */ }
  }
  // Warn (do not block) if the app is already open in another tab: two tabs would overwrite each other's backup.
  if (navigator.locks) {
    navigator.locks.request("notetaker-instance", { ifAvailable: true }, (lock) => {
      if (!lock) { banner("warn", "NoteTaker is already open in another tab or window. Edits made in both places can overwrite each other. Close one of them."); return; }
      return new Promise(() => {});    // hold the lock until this page closes
    });
  }
})();
</script>
